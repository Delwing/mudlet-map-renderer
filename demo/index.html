<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Map Renderer — Demo</title>
    <link rel="stylesheet" href="/demo.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>
<div id="stage"></div>
<div id="demo-preview-container">
    <div id="demo-preview-bg"></div>
    <div id="demo-preview-pan"></div>
</div>
<div id="context-menu" hidden>
    <div id="context-menu-content"></div>
</div>
<div id="hud">
    <div class="panel-section panel-header">
        <div class="panel-header-row">
            <div id="status">Loading map...</div>
            <button type="button" id="panel-toggle" class="btn btn-icon" title="Toggle controls">&#9776;</button>
        </div>
        <div id="fps">FPS: --</div>
        <div id="perf-stats"></div>
        <div id="walker-status"></div>
        <div id="culling-status"></div>
        <div class="header-selects">
            <label class="select-label">
                <span>Area</span>
                <select id="area-select"></select>
            </label>
            <label class="select-label">
                <span>Level (Z)</span>
                <select id="level-select"></select>
            </label>
        </div>
    </div>

    <div id="controls">
        <!-- Navigation -->
        <div class="panel-section">
            <div class="section-title">Navigation</div>
            <button type="button" id="walker-toggle" class="btn">Start walker</button>
            <form id="room-form" class="inline-form">
                <label for="room-input">Current room</label>
                <div class="control-inputs">
                    <input type="number" id="room-input" min="1" placeholder="Room ID" />
                    <button type="submit" class="btn btn-sm">Go</button>
                </div>
                <div class="form-status" id="room-status"></div>
            </form>
            <form id="look-form" class="inline-form">
                <label for="look-input">Look at room</label>
                <div class="control-inputs">
                    <input type="number" id="look-input" min="1" placeholder="Room ID" />
                    <button type="submit" class="btn btn-sm">Look</button>
                </div>
                <div class="form-status" id="look-status"></div>
            </form>
            <form id="destination-form" class="inline-form">
                <label for="destination-input">Destination room</label>
                <div class="control-inputs">
                    <input type="number" id="destination-input" min="1" placeholder="Room ID" />
                    <button type="submit" class="btn btn-sm">Set</button>
                    <button type="button" id="destination-clear" class="btn btn-sm btn-muted">Clear</button>
                </div>
                <div class="form-status" id="destination-status"></div>
            </form>
            <label class="check-label">
                <input type="checkbox" id="instant-move-toggle">
                <span>Instant map movement</span>
            </label>
        </div>

        <!-- Map Settings -->
        <div class="panel-section">
            <div class="section-title">Map Settings</div>
            <label class="select-label">
                <span>Culling mode</span>
                <select id="culling-mode">
                    <option value="none">No culling</option>
                    <option value="basic">Classic culling</option>
                    <option value="indexed">Spatial index culling</option>
                </select>
            </label>
            <label class="select-label">
                <span>Pathfinding algorithm</span>
                <select id="pathfinding-algorithm">
                    <option value="dijkstra">Dijkstra</option>
                    <option value="astar">A* (spatial)</option>
                </select>
            </label>
        </div>

        <!-- Appearance -->
        <div class="panel-section">
            <div class="section-title">Appearance</div>
            <label class="select-label">
                <span>Room shape</span>
                <select id="room-shape">
                    <option value="rectangle">Rectangle</option>
                    <option value="roundedRectangle">Rounded Rectangle</option>
                    <option value="circle">Circle</option>
                </select>
            </label>
            <label class="select-label">
                <span>Room size: <span id="room-size-value">0.6</span></span>
                <input type="range" id="room-size-slider" min="0.2" max="1.5" step="0.1" value="0.6">
            </label>
            <label class="select-label">
                <span>Line width: <span id="line-width-value">0.025</span></span>
                <input type="range" id="line-width-slider" min="0.01" max="0.1" step="0.005" value="0.025">
            </label>
            <label class="select-label">
                <span>Label render mode</span>
                <select id="label-render-mode">
                    <option value="image">Image</option>
                    <option value="data">Data</option>
                    <option value="data-transparent">Data (transparent)</option>
                </select>
            </label>
            <div class="color-row">
                <label class="color-label">
                    <input type="color" id="background-color" value="#000000">
                    <span>Background</span>
                </label>
                <label class="color-label">
                    <input type="color" id="line-color" value="#e1ffe1">
                    <span>Lines</span>
                </label>
                <label class="color-label">
                    <input type="color" id="path-color" value="#66E64D">
                    <span>Path</span>
                </label>
            </div>
        </div>

        <!-- Toggles -->
        <div class="panel-section">
            <div class="section-title">Effects</div>
            <div class="toggle-grid">
                <label class="check-label">
                    <input type="checkbox" id="exploration-toggle">
                    <span>Exploration overlay</span>
                </label>
                <label class="check-label">
                    <input type="checkbox" id="highlight-toggle">
                    <span>Highlight current room</span>
                </label>
                <label class="check-label">
                    <input type="checkbox" id="grid-toggle">
                    <span>Background grid</span>
                </label>
                <label class="color-label" id="grid-color-label">
                    <input type="color" id="grid-color" value="#c8c8c8">
                    <span>Grid color</span>
                </label>
                <label class="select-label" id="grid-opacity-label">
                    <span>Grid opacity: <span id="grid-opacity-value">0.15</span></span>
                    <input type="range" id="grid-opacity" min="0.01" max="1.0" step="0.01" value="0.15">
                </label>
                <label class="select-label">
                    <span>Location style</span>
                    <select id="location-style">
                        <option value="normal">Normal</option>
                        <option value="frame">Frames</option>
                        <option value="colored">Colored</option>
                    </select>
                </label>
                <label class="select-label">
                    <span>Render mode</span>
                    <select id="render-mode">
                        <option value="normal">Normal</option>
                        <option value="pencil">Pencil</option>
                        <option value="parchment">Parchment</option>
                        <option value="parchment-pencil">Parchment + Pencil</option>
                        <option value="isometric">Isometric</option>
                        <option value="isometric-parchment">Isometric + Parchment</option>
                        <option value="blueprint">Blueprint</option>
                        <option value="neon">Neon</option>
                        <option value="construction">Construction</option>
                        <option value="scifi">Sci-Fi</option>
                    </select>
                </label>
                <label class="color-label" id="sketch-color-label" style="display:none">
                    <input type="color" id="sketch-color" value="#444444">
                    <span>Pencil color</span>
                </label>
                <label class="select-label" id="iso-rotation-label" style="display:none">
                    <span>Iso rotation: <span id="iso-rotation-value">30</span>°</span>
                    <input type="range" id="iso-rotation" min="0" max="360" step="5" value="30">
                </label>
                <label class="check-label">
                    <input type="checkbox" id="emboss-toggle">
                    <span>Emboss effect</span>
                </label>
                <label class="check-label">
                    <input type="checkbox" id="area-name-toggle">
                    <span>Area name header</span>
                </label>
                <label class="check-label">
                    <input type="checkbox" id="area-exit-labels-toggle">
                    <span>Area exit labels</span>
                </label>
                <label class="select-label">
                    <span>Area exit label size: <span id="area-exit-label-size-value">0.30</span></span>
                    <input type="range" id="area-exit-label-size-slider" min="0.15" max="1.0" step="0.05" value="0.3">
                </label>
                <label class="check-label">
                    <input type="checkbox" id="uniform-level-size-toggle">
                    <span>Uniform level size</span>
                </label>
                <label class="check-label">
                    <input type="checkbox" id="borders-toggle">
                    <span>Room borders</span>
                </label>
                <label class="check-label">
                    <input type="checkbox" id="ambient-light-toggle">
                    <span>Ambient lighting</span>
                </label>
                <label class="check-label">
                    <input type="checkbox" id="terrain-effects-toggle">
                    <span>Terrain effects</span>
                </label>
                <label class="check-label">
                    <input type="checkbox" id="fog-of-war-toggle">
                    <span>Fog of war</span>
                </label>
                <label class="check-label">
                    <input type="checkbox" id="hit-areas-toggle">
                    <span>Hit areas (debug)</span>
                </label>
            </div>
        </div>

        <!-- Ambient Lighting -->
        <details class="panel-section collapsible">
            <summary class="section-title">Ambient Lighting</summary>
            <div class="details-body">
                <label class="color-label">
                    <input type="color" id="ambient-light-color" value="#ffcc44">
                    <span>Light color</span>
                </label>
                <label class="select-label">
                    <span>Radius: <span id="ambient-light-radius-value">12</span></span>
                    <input type="range" id="ambient-light-radius" min="3" max="40" step="1" value="12">
                </label>
                <label class="select-label">
                    <span>Intensity: <span id="ambient-light-intensity-value">0.70</span></span>
                    <input type="range" id="ambient-light-intensity" min="0.1" max="1.0" step="0.05" value="0.7">
                </label>
            </div>
        </details>


        <!-- Weather -->
        <details class="panel-section collapsible">
            <summary class="section-title">Weather</summary>
            <div class="details-body">
                <label class="select-label">
                    <span>Effect</span>
                    <select id="weather-type">
                        <option value="none">None</option>
                        <option value="rain">Rain</option>
                        <option value="snow">Snow</option>
                        <option value="fog">Fog</option>
                        <option value="dust">Dust</option>
                    </select>
                </label>
                <label class="select-label">
                    <span>Intensity: <span id="weather-intensity-value">0.50</span></span>
                    <input type="range" id="weather-intensity" min="0.1" max="1.0" step="0.05" value="0.5">
                </label>
                <label class="select-label">
                    <span>Wind angle: <span id="weather-wind-angle-value">10</span>°</span>
                    <input type="range" id="weather-wind-angle" min="-90" max="90" step="5" value="10">
                </label>
                <label class="select-label">
                    <span>Wind strength: <span id="weather-wind-strength-value">1.00</span></span>
                    <input type="range" id="weather-wind-strength" min="0" max="3.0" step="0.1" value="1.0">
                </label>
            </div>
        </details>

        <!-- Player Marker -->
        <details class="panel-section collapsible">
            <summary class="section-title">Player Marker</summary>
            <div class="details-body">
                <div class="color-row">
                    <label class="color-label">
                        <input type="color" id="player-marker-stroke-color" value="#00e5b2">
                        <span>Stroke</span>
                    </label>
                    <label class="color-label">
                        <input type="color" id="player-marker-fill-color" value="#00e5b2">
                        <span>Fill</span>
                    </label>
                </div>
                <label class="select-label">
                    <span>Stroke alpha: <span id="player-marker-stroke-alpha-value">1.00</span></span>
                    <input type="range" id="player-marker-stroke-alpha" min="0" max="1" step="0.01" value="1">
                </label>
                <label class="select-label">
                    <span>Fill alpha: <span id="player-marker-fill-alpha-value">0.00</span></span>
                    <input type="range" id="player-marker-fill-alpha" min="0" max="1" step="0.01" value="0">
                </label>
                <label class="select-label">
                    <span>Stroke width: <span id="player-marker-stroke-width-value">0.10</span></span>
                    <input type="range" id="player-marker-stroke-width" min="0.01" max="0.3" step="0.01" value="0.1">
                </label>
                <label class="select-label">
                    <span>Size factor: <span id="player-marker-size-value">1.70</span></span>
                    <input type="range" id="player-marker-size" min="0.5" max="3.0" step="0.05" value="1.7">
                </label>
                <label class="check-label">
                    <input type="checkbox" id="player-marker-dash-enabled" checked>
                    <span>Dashed line</span>
                </label>
                <label class="check-label">
                    <input type="checkbox" id="player-marker-match-shape">
                    <span>Match room shape</span>
                </label>
            </div>
        </details>

        <!-- Highlight -->
        <details class="panel-section collapsible">
            <summary class="section-title">Highlight</summary>
            <div class="details-body">
                <label class="select-label">
                    <span>Stroke alpha: <span id="highlight-stroke-alpha-value">1.00</span></span>
                    <input type="range" id="highlight-stroke-alpha" min="0" max="1" step="0.01" value="1">
                </label>
                <label class="select-label">
                    <span>Fill alpha: <span id="highlight-fill-alpha-value">0.00</span></span>
                    <input type="range" id="highlight-fill-alpha" min="0" max="1" step="0.01" value="0">
                </label>
                <label class="select-label">
                    <span>Stroke width: <span id="highlight-stroke-width-value">0.10</span></span>
                    <input type="range" id="highlight-stroke-width" min="0.01" max="0.3" step="0.01" value="0.1">
                </label>
                <label class="select-label">
                    <span>Size factor: <span id="highlight-size-value">1.43</span></span>
                    <input type="range" id="highlight-size" min="0.5" max="3.0" step="0.05" value="1.425">
                </label>
                <label class="check-label">
                    <input type="checkbox" id="highlight-dash-enabled" checked>
                    <span>Dashed line</span>
                </label>
                <label class="check-label">
                    <input type="checkbox" id="highlight-match-shape" checked>
                    <span>Match room shape</span>
                </label>
            </div>
        </details>

        <!-- Export -->
        <div class="panel-section">
            <div class="btn-row">
                <button type="button" id="save-png-btn" class="btn">Save PNG</button>
                <button type="button" id="save-svg-btn" class="btn">Save SVG</button>
            </div>
        </div>
    </div>
</div>
<script type="module" src="/main.ts"></script>
</body>
</html>
