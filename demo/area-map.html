<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Area Map Renderer — Demo</title>
    <link rel="stylesheet" href="/demo.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        html, body {
            background-color: #1a1a2e;
        }
    </style>
</head>
<body>
<div id="stage"></div>
<div id="hud">
    <div class="panel-section">
        <h2>Area Map</h2>
        <div id="status">Loading map data...</div>
        <div id="area-info"></div>
    </div>

    <div id="controls">
        <div class="panel-section">
            <div class="section-title">Display</div>
            <label class="select-label">
                <span>Domain</span>
                <select id="domain-select">
                    <option value="ishtar">Ishtar</option>
                    <option value="empire">Empire</option>
                    <option value="interdomain">Interdomain (neutral)</option>
                </select>
            </label>
            <label class="check-label">
                <input type="checkbox" id="dots-mode-toggle">
                <span>Dots mode (white lines, small dots)</span>
            </label>
        </div>

        <div class="panel-section">
            <div class="section-title">Background</div>
            <label class="select-label">
                <span>Scale: <span id="bg-scale-value">1.0</span></span>
                <input type="range" id="bg-scale-slider" min="0.1" max="3.0" step="0.1" value="1.0">
            </label>
            <label class="select-label">
                <span>X offset: <span id="bg-x-value">-400</span></span>
                <input type="range" id="bg-x-slider" min="-1000" max="1000" step="10" value="-400">
            </label>
            <label class="select-label">
                <span>Y offset: <span id="bg-y-value">-300</span></span>
                <input type="range" id="bg-y-slider" min="-1000" max="1000" step="10" value="-300">
            </label>
            <label class="select-label">
                <span>Opacity: <span id="bg-opacity-value">0.25</span></span>
                <input type="range" id="bg-opacity-slider" min="0.05" max="1.0" step="0.05" value="0.25">
            </label>
        </div>

        <div class="panel-section">
            <div class="btn-row">
                <button type="button" id="fit-view" class="btn">Fit to View</button>
                <button type="button" id="reset-zoom" class="btn">Reset Zoom</button>
            </div>
        </div>
    </div>

    <div id="legend">
        <strong>Legend:</strong>
        <ul>
            <li>Lines = area connections</li>
            <li>Numbers = connection count</li>
            <li>Click area to highlight</li>
        </ul>
    </div>
    <a href="/" class="nav-link">&larr; Back to Room Map</a>
</div>
<script type="module" src="/area-map.ts"></script>
</body>
</html>
