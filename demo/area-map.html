<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Area Map Renderer — Demo</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            font-family: Inter, system-ui, sans-serif;
            background-color: #1a1a2e;
            color: #fff;
        }

        body {
            position: relative;
            overflow: hidden;
        }

        #stage {
            width: 100%;
            height: 100%;
        }

        #hud {
            position: absolute;
            top: 1rem;
            left: 1rem;
            padding: 0.75rem 1rem;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 0.5rem;
            font-size: 0.9rem;
            line-height: 1.4;
            pointer-events: auto;
            max-width: 280px;
        }

        #hud h2 {
            margin: 0 0 0.5rem 0;
            font-size: 1.1rem;
            color: #63bbff;
        }

        #status {
            color: #c8f7ff;
            margin-bottom: 0.5rem;
        }

        #area-info {
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 0.85rem;
            max-height: 300px;
            overflow-y: auto;
        }

        #area-info .label {
            color: #8ee7ff;
        }

        #controls {
            margin-top: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        #controls button {
            padding: 0.4rem 0.75rem;
            background: rgba(32, 40, 56, 0.8);
            color: #e8fafe;
            border: 1px solid rgba(99, 187, 255, 0.4);
            border-radius: 0.35rem;
            font: inherit;
            cursor: pointer;
        }

        #controls button:hover {
            background: rgba(99, 187, 255, 0.3);
        }

        #controls select {
            width: 100%;
            padding: 0.25rem 0.35rem;
            background: rgba(32, 40, 56, 0.7);
            color: #e8fafe;
            border: 1px solid rgba(99, 187, 255, 0.4);
            border-radius: 0.35rem;
            font: inherit;
        }

        .select-label {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .back-link {
            display: inline-block;
            margin-top: 0.75rem;
            color: #63bbff;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        #legend {
            margin-top: 0.75rem;
            padding-top: 0.5rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 0.8rem;
            color: #8ee7ff;
        }

        #legend ul {
            margin: 0.25rem 0 0 0;
            padding-left: 1rem;
        }

        #legend li {
            margin: 0.15rem 0;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>
<div id="stage"></div>
<div id="hud">
    <h2>Area Map</h2>
    <div id="status">Loading map data...</div>
    <div id="area-info"></div>
    <div id="controls">
        <label class="select-label">
            <span>Domain</span>
            <select id="domain-select">
                <option value="ishtar">Ishtar</option>
                <option value="empire">Empire</option>
                <option value="interdomain">Interdomain (neutral)</option>
            </select>
        </label>
        <button type="button" id="fit-view">Fit to View</button>
        <button type="button" id="reset-zoom">Reset Zoom</button>
    </div>
    <div id="legend">
        <strong>Legend:</strong>
        <ul>
            <li>Lines = area connections</li>
            <li>Numbers = connection count</li>
            <li>Click area to highlight</li>
        </ul>
    </div>
    <a href="/" class="back-link">&larr; Back to Room Map</a>
</div>
<script type="module" src="/area-map.ts"></script>
</body>
</html>
