<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mudlet-map-renderer · backend benchmark</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 13px/1.4 system-ui, sans-serif; }
        #stage { position: fixed; inset: 0; }
        #hud {
            position: fixed; top: 12px; left: 12px; z-index: 10;
            width: 270px; padding: 14px 16px;
            background: rgba(18, 20, 24, 0.92); border: 1px solid #333; border-radius: 8px;
            backdrop-filter: blur(4px);
        }
        #hud .row { display: flex; justify-content: space-between; padding: 2px 0; }
        #hud .row.title { font-size: 15px; font-weight: 700; color: #00e5b2; padding-bottom: 8px; }
        #hud .row.hl b { color: #ffd166; }
        #hud b { font-variant-numeric: tabular-nums; }
        #hud .hint { margin: 10px 0; color: #9aa; font-size: 11px; }
        #hud .links { margin: 8px 0; font-size: 12px; }
        #hud .links a { color: #6cf; text-decoration: none; }
        #hud .links a:hover { text-decoration: underline; }
        #hud button { margin-top: 6px; width: 100%; padding: 6px; cursor: pointer;
            background: #222; color: #eee; border: 1px solid #444; border-radius: 6px; }
    </style>
</head>
<body>
    <div id="stage"></div>
    <div id="hud"></div>
    <script type="module" src="./main.ts"></script>
</body>
</html>
